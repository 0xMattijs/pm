# Automatic review of every PR against the task contracts it references.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review PR #${{ github.event.pull_request.number }}.
            Read .claude/WORKFLOW.md and .claude/agents/reviewer.md and apply that
            review procedure. Task IDs appear in commit messages as [NN-NN]; read
            each contract with `python3 scripts/task.py show <id>`.
            Post one summary comment and inline comments only for must-fix findings.
          claude_args: |
            --allowedTools "Bash(gh pr:*),Bash(git diff:*),Bash(git log:*),Bash(python3 scripts/task.py:*),Read,Grep,Glob"
